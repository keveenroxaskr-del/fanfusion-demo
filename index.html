const stat=(l,v,g=false)=>`<div class="card stat"><small>${esc(l)}</small><div class="num ${g?'green':''}">${g?'<span class="pulse"></span> ':''}${esc(v)}</div></div>`;const title=(t,d='')=>`<div class="sectionhead"><span class="eyebrow">FANFUSION / ${role==='admin'?'CONTROL CENTER':'MEMBER EXPERIENCE'}</span><h2 style="margin-top:6px">${esc(t)}</h2>${d?`<p>${esc(d)}</p>`:''}</div>`;const wrap=(s)=>`<div class="stack">${s}</div>`;const empty=s=>`<div class="empty">${esc(s)}</div>`;const table=(heads,rows)=>`<div class="tablewrap"><table><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map(v=>`<td>${v}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${heads.length}">No records yet.</td></tr>`}</tbody></table></div>`;const select=(name,opts,value='')=>`<select name="${name}">${opts.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select>`;const field=(l,n,v='',type='text')=>`<label>${esc(l)}<input type="${type}" name="${n}" value="${esc(v)}"></label>`;const area=(l,n,v='')=>`<label>${esc(l)}<textarea name="${n}">${esc(v)}</textarea></label>`;const fd=f=>Object.fromEntries(new FormData(f));const status=s=>`<span class="tag ${/Paid|Active|Sent|Correct|Resolved|Published|Win/i.test(s)?'green':/Expired|Loss|Ban|Failed|Incorrect/i.test(s)?'red':''}">${esc(s)}</span>`;
const modal=(html)=>{$('#overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between" style="margin-bottom:15px">${logo()}<button class="small ghost" onclick="closeModal()">✕</button></div>${html}</div></div>`};const closeModal=()=>$('#overlay').innerHTML='';function loginModal(){modal(`<h2>Welcome back.</h2><p style="margin:10px 0">Enter your demo credentials to experience the portal.</p><form class="form" onsubmit="event.preventDefault();login(this)">${field('Username','username')}${field('Password','password','','password')}<button class="primary">Log in</button></form><div class="hr"></div><div class="grid"><button onclick="quickLogin('VIP')">VIP demo</button><button onclick="quickLogin('ADMIN')">Admin demo</button><button onclick="quickLogin('MEMBER')">Free member demo</button><button onclick="registerModal()">Register demo</button></div><p style="margin-top:10px;font-size:12px">ADMIN / ADMIN123 · VIP / VIP123. Google login and email verification are simulations only.</p>`)}function quickLogin(u){login({username:{value:u},password:{value:u+'123'}})}function login(f){let u=f.username.value.trim().toUpperCase(),p=f.password.value;if(u==='ADMIN'&&p==='ADMIN123'){role='admin';user={username:'ADMIN',id:'OWNER'};page='overview'}else{let m=db.members.find(x=>x.username.toUpperCase()===u);if(!m||p!==u+'123'||m.status!=='Active'){toast('Invalid demo login or account is suspended.');return}role='member';user=m;page=pending||'dashboard'}pending='';closeModal();go(page);toast('Welcome, '+u)}function registerModal(){modal(`<h2>Join the community.</h2><p>Demo registration. Do not enter real personal information.</p><button class="full" style="margin:12px 0" onclick="toast('Google sign-in requires a real OAuth service. Demo only.')">G · Continue with Google</button><form class="form" onsubmit="event.preventDefault();registerStep(this)">${field('Full name','name')}${field('Username','username')}${field('Email','email','','email')}${field('Date of birth','dob','','date')}${field('Country','country','United States')}<label class="check"><input type="checkbox" required> I confirm that I meet the legal age requirements in my location.</label><button class="primary">Create demo account</button></form>`)}function registerStep(f){let d=fd(f);if(!d.username||!d.name||!d.email||!d.dob||!d.country){toast('Complete all fields');return}if(db.members.some(m=>m.username.toLowerCase()===d.username.toLowerCase()||m.email===d.email)){toast('Username or email already exists');return}draft=d;modal(`<h2>Verify your email</h2><p>Demo verification code: <b>123456</b>. No email is sent.</p><form class="form" onsubmit="event.preventDefault();completeRegister(this)">${field('6-digit code','code')}<button class="primary">Verify</button></form>`)}function completeRegister(f){if(f.code.value!=='123456'){toast('Use demo code 123456');return}let d=draft;let m={...d,id:'FF-'+id().toUpperCase(),role:'free',vip:false,clips:false,status:'Active'};db.members.push(m);save();user=m;role='member';closeModal();go(pending||'dashboard');pending='';toast('Demo account created. Password for future demo login: '+m.username.toUpperCase()+'123')}
const about=()=>`<section class="section stack"><div class="eyebrow">FANFUSION VENTURES</div><h1>CONNECTING FANS.<br>DRIVING GROWTH.</h1><p>FanFusion Ventures helps daily fantasy sports apps reach fans through direct marketing, digital selling and social media campaigns. Based in San Diego, the team emphasizes innovation, integrity and collaboration.</p><div class="grid grid3">${['Innovation','Integrity','Collaboration'].map(t=>`<div class="card"><h3>${t}</h3><p>Core values of FanFusion Ventures.</p></div>`).join('')}</div><p>Company information adapted from <a href="https://fanfusionventures.com/about/" target="_blank" rel="noopener">the existing website</a>. Historical marketing claims require re-verification before launch.</p><button onclick="go('contact')">Contact our team</button></section>`;const partners=()=>`<section class="${role==='public'?'section':'stack'}"><div class="sectionhead"><h2>PARTNER CENTER</h2><p>Existing website partner listings — verify current agreements before launch.</p></div><div class="grid grid4">${['Winnable','Passes','Ellipsend','Wapp'].map(x=>`<div class="card"><div class="eyebrow">Partner listing</div><h3 style="margin-top:12px">${x}</h3></div>`).join('')}</div><div class="card" style="margin-top:16px"><h3>Work with FANFUSION</h3><p>Strategic planning, creative campaign execution and performance analysis for DFS app partners.</p><a href="mailto:info@fanfusionventures.com">Contact our partnerships team ↗</a><p><a href="https://fanfusionventures.com/partners/" target="_blank" rel="noopener">Source: existing partners page</a></p></div></section>`;const contact=()=>`<section class="section stack"><h2>GET IN TOUCH</h2><div class="card stack"><p>San Diego · FANFUSION Ventures</p><a href="mailto:info@fanfusionventures.com">info@fanfusionventures.com</a><a href="tel:+16199928420">+1 (619) 992 8420</a><a href="https://www.instagram.com/fanfusionmedia.io/" target="_blank" rel="noopener">@fanfusionmedia.io</a></div></section>`;const faq=()=>`<section class="section stack"><h2>FREQUENTLY ASKED QUESTIONS</h2>${[['How does Dropbox work?','Purchase a separate subscription. Our team manually sends a Dropbox invitation to your designated email. No guaranteed activation timeframe yet.'],['Is VIP included with Dropbox?','No. Subscriptions are separate.'],['Can I cancel?','Yes, recurring billing stops at the end of your paid period. Refunds subject to applicable law and service availability.'],['Are forecasts guaranteed?','No. Forecasts are uncertain estimates. Demo forecasts are not real analysis.']].map(([q,a])=>`<details class="card"><summary>${q}</summary><p style="margin-top:10px">${a}</p></details>`).join('')}</section>`;
function dropbox(){return `<div class="${role==='public'?'section':'stack'}"><div class="sectionhead"><span class="eyebrow">Creator access</span><h2>100,000+ SPORTS CLIPS.</h2><p>Your content. Our footage. The library lives on Dropbox, not this website.</p></div><div class="card stack"><div class="sportart" style="height:230px;font-size:64px">▷</div><h3>FANFUSION SHOWREEL</h3>${db.settings.video?`<video controls style="width:100%;max-height:400px" src="${esc(db.settings.video)}"></video>`:'<p>Sample video placeholder — upload an authorized showreel from the admin homepage editor. No downloadable samples.</p>'}</div><h3 style="margin:22px 0 12px">WHAT'S INSIDE OUR DROPBOX</h3><div class="grid grid3">${[['NBA','🏀'],['NFL','🏈'],['NHL / Hockey','🏒'],['MLB','⚾'],['Golf','⛳'],['College Football','🏟']].map(([t,i])=>`<div class="card interactive"><div class="sportart">${i}</div><h3 style="margin-top:10px">${t}</h3></div>`).join('')}</div><div class="grid mobile-one" style="margin-top:18px">${['Monthly','Yearly'].map(p=>`<div class="card stack"><div class="eyebrow">${p}</div><h2>${p==='Monthly'?'$100 / month':db.settings.yearly?money(db.settings.yearly)+' / year':'Price TBD'}</h2><p>Recurring subscription · Separate from VIP · Manual invitation</p><button class="primary" onclick="checkout('Dropbox','${p}')">${isClips()?'View my subscription':'Select '+p}</button></div>`).join('')}</div></div>`}function vipPage(){return `<div class="${role==='public'?'section':'stack'}"><div class="sectionhead"><span class="eyebrow" style="color:var(--gold)">Exclusive membership</span><h2 style="color:var(--gold)">FANFUSION VIP</h2><p>Separate paid access to the VIP Picks channel. Choose your subscription period.</p></div><div class="grid grid3 mobile-one">${['Weekly','Monthly','Yearly'].map(p=>`<div class="card goldcard stack"><div class="eyebrow" style="color:var(--gold)">${p}</div><h2>${db.settings['vip'+p]?money(db.settings['vip'+p]):'TBD'}</h2><p>VIP badge · Exclusive channel · Auto-renewal</p><button class="gold" onclick="checkout('VIP','${p}')">Select ${p}</button></div>`).join('')}</div></div>`}function checkout(prod,plan){if(role==='public'){pending=prod==='VIP'?'vip':'dropbox';loginModal();return}if((prod==='VIP'&&isVIP())||(prod==='Dropbox'&&isClips())){go('subscriptions');return}let m=member(),price=prod==='Dropbox'?(plan==='Monthly'?100:Number(db.settings.yearly||0)):Number(db.settings['vip'+plan]||0);modal(`<h2>${esc(prod)} checkout</h2><div class="demo">DEMO ONLY. No card information, payment, real receipt or Dropbox invitation will be sent. Undecided prices use $0 for testing.</div><form class="form" style="margin-top:14px" onsubmit="event.preventDefault();payDemo(this,'${prod}','${plan}',${price})">${field('Full name','name',m.name)}${field('Registered email','email',m.email,'email')}${prod==='Dropbox'?field('Dropbox invitation email','invite',m.email,'email'):''}${field('Instagram (optional)','ig',m.ig||'')}${field('Discount code','promo')}<label>Payment method${select('method',['Credit / debit card','PayPal'])}</label><p>Initial price: ${price?money(price):'TBD (demo $0)'}. Discounts first payment only. Automatic renewal until cancelled.</p><label class="check"><input type="checkbox" required> I understand this is a simulated transaction.</label><button class="primary">Simulate payment</button></form>`)}function payDemo(f,prod,plan,price){let m=member(),d=fd(f);let promo=db.promos.find(p=>p.active&&p.code.toUpperCase()===d.promo.toUpperCase()&&[prod,'Both'].includes(p.product)&&(!p.expires||new Date(p.expires)>new Date()));if(d.promo&&!promo){toast('Invalid or inapplicable promo code');return}let amount=price*(1-(promo?.percent||0)/100),tx={id:'DEMO-'+id(),member:m.id,product:prod,plan,amount,date:now(),status:'Paid',method:d.method};db.transactions.push(tx);m[prod==='VIP'?'vip':'clips']=true;m.ig=d.ig;let ticket;if(prod==='Dropbox'){ticket={id:'FF-DBX-'+id().toUpperCase(),type:'Dropbox',member:m.id,email:d.invite||m.email,name:d.name,plan,amount,status:'Pending invitation',date:now()};db.tickets.unshift(ticket)}log('Simulated '+prod+' payment');modal(`<h2>Payment simulation complete</h2><p>${money(amount)} · ${esc(plan)} · ${esc(prod)}</p>${ticket?`<div class="card stack" style="margin:15px 0"><small>SUBSCRIPTION TICKET</small><h3>${esc(ticket.id)}</h3><p>Pending manual Dropbox invitation. No email is actually sent.</p></div>`:''}<button class="full" onclick="receipt('${tx.id}')">Download demo receipt</button><button class="primary full" style="margin-top:10px" onclick="closeModal();go('subscriptions')">My subscriptions</button>`)}function receipt(t){let x=db.transactions.find(a=>a.id===t);if(!x)return;downloadText('FANFUSION-'+x.id+'.txt',`FANFUSION — DEMO RECEIPT (NOT A REAL PAYMENT)\n${x.id}\n${x.product} ${x.plan}\n${money(x.amount)}\n${x.date}`)}function downloadText(name,data){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
let dash=()=>wrap(`<div class="dashhero"><div class="eyebrow">MEMBER PORTAL / YOUR ACCESS</div><h2>WELCOME TO THE FUSION, ${esc(member()?.username)}.</h2><p>Your sports headquarters. Browse community content and manage your subscriptions.</p><div class="row"><span class="tag ${isVIP()?'goldtag':''}">${isVIP()?'♛ VIP PICKS':'FREE MEMBER'}</span>${isClips()?'<span class="tag">DROPBOX SUBSCRIBER</span>':''}</div></div><div class="grid grid3">${[['Free Picks','free','▤','Community channel'],['VIP Picks','vip','♛',isVIP()?'Exclusive access unlocked':'Subscription required'],['Dropbox Sports Clips','dropbox','▷',isClips()?'Subscribed · invitation status':'Separate creator subscription'],['FANFUSION Insights','insights','◉','Matchup forecasts'],['Sports Center','sports','◈','Schedules, standings and scores'],['Performance Tracker','performance','▥','Historical results'],['Announcements','announcements','◉','Company updates'],['Giveaway Center','giveaway','◇','Community campaigns'],['Support','support','?','Contact our team']].map(([t,p,i,d])=>`<div class="card interactive ${p==='vip'?'goldcard':''}" onclick="go('${p}')"><div class="row between"><span style="font-size:28px;color:${p==='vip'?'var(--gold)':'var(--purple)'}">${i}</span>${p==='vip'&&!isVIP()||p==='dropbox'&&!isClips()?'<span class="tag">LOCKED</span>':''}</div><h3 style="margin-top:14px">${t}</h3><p>${d}</p><small>Explore ↗</small></div>`).join('')}</div>`);
const sportsList=['All','NFL','NBA','MLB','NHL','UFC','NCAAF','NCAAB','WNBA','Golf','Soccer'];function filters(extra=true){return `<div class="row"><label>Sport${select('sport',sportsList,filter.sport).replace('<select','<select onchange="filter.sport=this.value;render()"')}</label>${extra?`<label>Analyst${select('analyst',['All','FANFUSION','AUX PICKS','RYAN PICKS','KEVS PICKS'],filter.analyst).replace('<select','<select onchange="filter.analyst=this.value;render()"')}</label><label>Date<input type="date" value="${esc(filter.date||'')}" onchange="filter.date=this.value;render()"></label>`:''}</div>`}function channel(ch){if(ch==='vip'&&!isVIP())return vipPage();let items=activePosts(ch).filter(p=>(filter.sport==='All'||p.sport===filter.sport)&&(filter.analyst==='All'||p.analyst===filter.analyst)&&(!filter.date||p.date.startsWith(filter.date)));return `<div class="channel stack">${title(ch==='vip'?'VIP PICKS CHANNEL':ch==='free'?'FREE PICKS CHANNEL':'ANNOUNCEMENTS','Admin-only publishing · Members may react and save content.')}<div class="card ${ch==='vip'?'goldcard':''}"><span class="tag ${ch==='vip'?'goldtag':''}">OFFICIAL FANFUSION</span><p style="margin-top:10px">${ch==='vip'?'Exclusive members only. Personalized watermark is shown on example media.':'Official community updates and posts.'}</p></div>${ch!=='announcements'?filters():''}${items.map(postCard).join('')||empty('No matching posts.')}</div>`}function postCard(p){let fav=(db.favorites[user?.id]||[]).includes(p.id);let reactions=db.settings.reactions.split(/\s+/).filter(Boolean);return `<article class="post stack ${p.channel==='vip'?'goldcard':''}"><div class="row between"><div><b style="color:${p.channel==='vip'?'var(--gold)':'var(--purple)'}">${esc(p.analyst)} ✓</b> <span class="tag">${esc(p.sport)}</span></div><small>${esc(fmt(p.date))}${p.edited?' · Edited':''}</small></div><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p>${p.link&&/^https?:\/\//i.test(p.link)?`<a href="${esc(p.link)}" target="_blank" rel="noopener">Open linked content ↗</a>`:''}${p.sample||p.media?.length?`<div class="postmedia ${p.layout==='Carousel'&&p.media?.length>1?'carousel':''}">${p.media?.length?p.media.map(m=>m.type.startsWith('video')?`<video controls src="${esc(m.src)}"></video>`:`<img src="${esc(m.src)}" alt="Uploaded post media" onclick="showImage(this.src)">`).join(''):`<div class="sample-slip"><span class="eyebrow">DEMO CONTENT CARD</span><h3>${p.channel==='vip'?'EXCLUSIVE CONTENT':'FREE CONTENT'}</h3><p>Placeholder — no actual betting slip.</p></div>`}${p.channel==='vip'?`<div class="watermark">${Array(4).fill(`<div>${esc(member()?.username||'ADMIN')} · ${esc(member()?.id||'ADMIN')}</div>`).join('')}</div>`:''}</div>`:''}<div class="row">${reactions.map(e=>`<button class="reaction ${p.reactions?.[e]?.includes(user?.id)?'selected':''}" onclick="react('${p.id}',${JSON.stringify(e).replace(/"/g,'&quot;')})">${esc(e)} ${p.reactions?.[e]?.length||0}</button>`).join('')}<button class="small" onclick="favorite('${p.id}')">${fav?'★ Saved':'☆ Save'}</button></div></article>`}function showImage(src){modal(`<img src="${esc(src)}" alt="Post image" style="width:100%">`)}function react(pid,e){let p=db.posts.find(x=>x.id===pid);if(!p||!user)return;p.reactions??={};let a=p.reactions[e]||[];p.reactions[e]=a.includes(user.id)?a.filter(x=>x!==user.id):[...a,user.id];save();render()}function favorite(pid){let a=db.favorites[user.id]||[];db.favorites[user.id]=a.includes(pid)?a.filter(x=>x!==pid):[...a,pid];save();render()}function forecastCard(f){return `<div class="card stack"><div class="row between"><span class="tag">${esc(f.sport)} · ${esc(f.day||'Upcoming')}</span><span class="tag">DEMO FORECAST</span></div><div class="row between"><div style="flex:1"><h3>${esc(f.a)}</h3>${f.modules.includes('win')?`<div class="score">${f.p}%</div>`:''}</div><b class="muted">VS</b><div class="right" style="flex:1"><h3>${esc(f.b)}</h3>${f.modules.includes('win')?`<div class="score">${100-f.p}%</div>`:''}</div></div> performance=function(admin=false){let all=db.records,days={Weekly:7,Monthly:30,Yearly:365}[ffPeriod],base=new Date(Math.max(Date.now(),...all.map(r=>Date.parse(r.date)||0))),cut=new Date(base.getTime()-(days-1)*86400000).toISOString().slice(0,10),rows=all.filter(r=>r.date>=cut&&(filter.sport==='All'||r.sport===filter.sport)&&(filter.analyst==='All'||r.analyst===filter.analyst));let settled=rows.filter(r=>['Win','Loss','Void','Push'].includes(r.result)).sort((a,b)=>a.date.localeCompare(b.date)),running=0,pts=[0,...settled.map(r=>running+=Number(r.profit)||0)],min=Math.min(...pts,0),max=Math.max(...pts,0),range=max-min||1,x=i=>38+i*525/Math.max(1,pts.length-1),y=v=>22+(max-v)*138/range;let path=pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');let graph=`<div class="card stack"><div class="row between"><div><h3>NET PERFORMANCE · ${ffPeriod.toUpperCase()}</h3><small>Cumulative sample profit / loss · ${cut} onwards</small></div><h2 style="color:${running>=0?'var(--green)':'var(--red)'}">${money(running)}</h2></div><svg class="ff-chart" viewBox="0 0 600 195" role="img" aria-label="Cumulative sample profit and loss"><path d="M38 ${y(0)}H563" stroke="#61566d" stroke-dasharray="5 5"/><text x="4" y="${y(0)+4}" font-size="10" fill="#aaa">$0</text><path d="${path}" stroke="${running>=0?'#65d6a1':'#f28b9b'}" stroke-width="3" fill="none" stroke-linejoin="round"/>${pts.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#c4a5ff"><title>${money(v)}</title></circle>`).join('')}<text x="38" y="185" font-size="11" fill="#aaa">Start</text><text x="563" y="185" text-anchor="end" font-size="11" fill="#aaa">Latest</text></svg><p>${settled.length?`${settled.filter(r=>r.result==='Win').length} wins and ${settled.filter(r=>r.result==='Loss').length} losses. The line rises on profitable sample outcomes and falls on losses.`:'No settled records in this period.'} All numbers are synthetic; not a claim of actual FANFUSION performance.</p></div>`;

function v7GiveDeadline(){let d=db.giveaway.end;if(!d)return NaN;let base=Date.parse(d+'T23:59:59Z');if(!Number.isFinite(base))return NaN;let dt=new Date(base),parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(dt),p=Object.fromEntries(parts.map(x=>[x.type,x.value])),local=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second);return base+(base-local)}

function v8Home(){let h=v8OldHome(),a=h.indexOf('<section class="hero v6-hero">'),b=h.indexOf('</section>',a);if(a<0||b<0)throw Error('Hero markup missing');h=h.slice(0,a)+`<section class="hero v8-hero"><img class="v8-hero-image" src="${v8HeroAsset}" alt="FANFUSION multi-sport athlete artwork" fetchpriority="high" decoding="async" width="1500" height="844"><div class="v8-hero-shade"></div><div class="v8-hero-copy"><span class="eyebrow">FANFUSION VENTURES</span><h1>${esc(db.settings.headline).split('\n').map((s,i)=>i?`<span>${s}</span>`:s).join('<br>')}</h1><p>${esc(db.settings.description)}</p><div class="v8-hero-actions"><button class="primary" onclick="registerModal()">Join free ↗</button><button class="gold" onclick="go('vip')">Explore VIP</button><button onclick="go('dropbox')">Sports clips</button></div></div><small class="v8-artcredit">FANFUSION supplied artwork · illustrative graphic</small></section>`+h.slice(b+10);

function v8Messages(ch){let admin=role==='admin';if(!admin&&ch==='vip'&&!isVIP())return v8OldChat(ch);if(v6ChannelKey!==ch){v6ChannelKey=ch;v6ChannelQuery=''}let posts=activePosts(ch).slice().sort((a,b)=>Date.parse(a.date)-Date.parse(b.date)||String(a.id).localeCompare(String(b.id))),pin=posts.find(p=>p.v6Pinned),last='',q=v6ChannelQuery.toLowerCase();return `<div class="ff-chat v8-chat channel"><div class="ff-chathead row between"><div class="row"><span class="ff-avatar">${ch==='vip'?'♛':ch==='free'?'#':'◉'}</span><div><h3>${ch==='vip'?'VIP PICKS':ch==='free'?'FREE PICKS':'ANNOUNCEMENTS'}</h3><small>${admin?'Admin broadcast channel':'Official channel · Read, react and save'}</small></div></div><button class="small" onclick="go('${admin?'publisher':'archive'}')">${admin?'Schedule':'Archive'}</button></div><div class="v6-channel-tools"><input type="search" aria-label="Search channel messages" placeholder="Search messages" value="${esc(v6ChannelQuery)}" oninput="v6ChatFilter(this)"><button class="small" onclick="v6Gallery('${ch}')">Media</button><button class="small" onclick="v8Latest()">Latest ↓</button></div>${pin?`<button class="v6-pin" onclick="v8JumpTo('${v7SafeId(pin.id)}')">📌 ${esc(pin.title||pin.body.slice(0,80))}</button>`:''}<div class="v8-historyhint">↑ Scroll up for older messages</div><div class="ff-chat-feed v8-feed" id="ffChatFeed" tabindex="0" aria-label="Channel messages, oldest to newest">${posts.map(p=>{let date=p.date.slice(0,10),sep=date!==last?`<div class="v6-day">${esc(v7Date(p.date))}</div>`:'';last=date;let hide=q&&!(`${p.title||''} ${p.body||''} ${p.analyst||''}`).toLowerCase().includes(q);return `${sep}<div class="ff-message" id="v6-post-${v7SafeId(p.id)}" ${hide?'hidden':''}><div class="v6-author"><span class="v6-avatar">FF</span><span>${esc(p.analyst||'FANFUSION')} · ${esc(new Date(p.date).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}))}</span>${admin?`<button class="small" onclick="v6Pin('${v7SafeId(p.id)}')">${p.v6Pinned?'
