const editorial=[['NFL','THE BRONCOS DRAFTED A MINI HULK?!','Jonah Coleman rookie spotlight','https://www.instagram.com/reel/DgJUkLNurYz/','🏈'],['NBA','IS THE DYNASTY OVER?','OKC Thunder discussion','https://www.instagram.com/p/DgHF9osn4HW/','🏀'],['NBA','WEMBY BROKE BASKETBALL?!','A creative play sparked debate','https://www.instagram.com/reel/Df_Au_qIH-0/','🏀'],['NFL','THE NFL BUYING COLLEGE FOOTBALL?!','Explore the hypothetical idea','https://www.instagram.com/reel/DgEVqLCu6iT/','🏟']];const home=()=>`${db.settings.promoOn?`<div class="notice" style="background:#47276c">${esc(db.settings.promo)} ${db.settings.promoEnd?` · <span id="promoCountdown">${esc(db.settings.promoEnd)}</span>`:''}</div>`:''}${ticker()}<section class="hero">${stadium}<div class="hero-inner"><span class="eyebrow">THE FANFUSION EXPERIENCE / 01</span><h1 style="margin-top:18px">${esc(db.settings.headline).split('\n').map((s,i)=>i?`<span>${s}</span>`:s).join('<br>')}</h1><p>${esc(db.settings.description)}</p><div class="row"><button class="primary" onclick="registerModal()">Join the community ↗</button><button onclick="document.getElementById('products').scrollIntoView()">Explore membership ↓</button></div><div class="row" style="margin-top:24px"><span class="tag">SPORTS CULTURE</span><span class="tag">CREATOR ACCESS</span><span class="tag goldtag">VIP MEMBERSHIP</span></div></div></section><section class="section" id="products"><div class="sectionhead"><span class="eyebrow">Choose your experience</span><h2>THE GAME IS YOURS.</h2></div><div class="grid mobile-one">${productCard('dropbox')}${productCard('vip')}</div></section><section class="section" style="padding-top:10px"><div class="sectionhead"><span class="eyebrow">Member portal preview</span><h2>STEP INSIDE THE FUSION.</h2><p>Explore the experience before creating your account.</p></div><div class="previewframe grid grid4">${[['Free Picks','free','▤'],['Insights','insights','◉'],['Sports Center','sports','◈'],['Performance','performance','▥ const modal=(html)=>{$('#overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row between" style="margin-bottom:15px">${logo()}<button class="small ghost" onclick="closeModal()">✕</button></div>${html}</div></div>`};const closeModal=()=>$('#overlay').innerHTML='';function loginModal(){modal(`<h2>Welcome back.</h2><p style="margin:10px 0">Enter your demo credentials to experience the portal.</p><form class="form" onsubmit="event.preventDefault();login(this)">${field('Username','username')}${field('Password','password','','password')}<button class="primary">Log in</button></form><div class="hr"></div><div class="grid"><button onclick="quickLogin('VIP')">VIP demo</button><button onclick="quickLogin('ADMIN')">Admin demo</button><button onclick="quickLogin('MEMBER')">Free member demo</button><button onclick="registerModal()">Register demo</button></div><p style="margin-top:10px;font-size:12px">ADMIN / ADMIN123 · VIP / VIP123. Google login and email verification are simulations only.</p>`)}function quickLogin(u){login({username:{value:u},password:{value:u+'123'}})}function login(f){let u=f.username.value.trim().toUpperCase(),p=f.password.value;if(u==='ADMIN'&&p==='ADMIN123'){role='admin';user={username:'ADMIN',id:'OWNER'};page='overview'}else{let m=db.members.find(x=>x.username.toUpperCase()===u);if(!m||p!==u+'123'||m.status!=='Active'){toast('Invalid demo login or account is suspended.');return}role='member';user=m;page=pending||'dashboard'}pending='';closeModal();go(page);toast('Welcome, '+u)}function registerModal(){modal(`<h2>Join the community.</h2><p>Demo registration. Do not enter real personal information.</p><button class="full" style="margin:12px 0" onclick="toast('Google sign-in requires a real OAuth service. Demo only.')">G · Continue with Google</button><form class="form" onsubmit="event.preventDefault();registerStep(this)">${field('Full name','name')}${field('Username','username')}${field('Email','email','','email')}${field('Date of birth','dob','','date')}${field('Country','country','United States')}<label class="check"><input type="checkbox" required> I confirm that I meet the legal age requirements in my location.</label><button class="primary">Create demo account</button></form>`)}function registerStep(f){let d=fd(f);if(!d.username||!d.name||!d.email||!d.dob||!d.country){toast('Complete all fields');return}if(db.members.some(m=>m.username.toLowerCase()===d.username.toLowerCase()||m.email===d.email)){toast('Username or email already exists');return}draft=d;modal(`<h2>Verify your email</h2><p>Demo verification code: <b>123456</b>. No email is sent.</p><form class="form" onsubmit="event.preventDefault();completeRegister(this)">${field('6-digit code','code')}<button class="primary">Verify</button></form>`)}function completeRegister(f){if(f.code.value!=='123456'){toast('Use demo code 123456');return}let d=draft;let m={...d,id:'FF-'+id().toUpperCase(),role:'free',vip:false,clips:false,status:'Active'};db.members.push(m);save();user=m;role='member';closeModal();go(pending||'dashboard');pending='';toast('Demo account created. Password for future demo login: '+m.username.toUpperCase()+'123')}
const about=()=>`<section class="section stack"><div class="eyebrow">FANFUSION VENTURES</div><h1>CONNECTING FANS.<br>DRIVING GROWTH.</h1><p>FanFusion Ventures helps daily fantasy sports apps reach fans through direct marketing, digital selling and social media campaigns. Based in San Diego, the team emphasizes innovation, integrity and collaboration.</p><div class="grid grid3">${['Innovation','Integrity','Collaboration'].map(t=>`<div class="card"><h3>${t}</h3><p>Core values of FanFusion Ventures.</p></div>`).join('')}</div><p>Company information adapted from <a href="https://fanfusionventures.com/about/" target="_blank" rel="noopener">the existing website</a>. Historical marketing claims require re-verification before launch.</p><button onclick="go('contact')">Contact our team</button></section>`;const partners=()=>`<section class="${role==='public'?'section':'stack'}"><div class="sectionhead"><h2>PARTNER CENTER</h2><p>Existing website partner listings — verify current agreements before launch.</p></div><div class="grid grid4">${['Winnable','Passes','Ellipsend','Wapp'].map(x=>`<div class="card"><div class="eyebrow">Partner listing</div><h3 style="margin-top:12px">${x}</h3></div>`).join('')}</div><div class="card" style="margin-top:16px"><h3>Work with FANFUSION</h3><p>Strategic planning, creative campaign execution and performance analysis for DFS app partners.</p><a href="mailto:info@fanfusionventures.com">Contact our partnerships team ↗</a><p><a href="https://fanfusionventures.com/partners/" target="_blank" rel="noopener">Source: existing partners page</a></p></div></section>`;const contact=()=>`<section class="section stack"><h2>GET IN TOUCH</h2><div class="card stack"><p>San Diego · FANFUSION Ventures</p><a href="mailto:info@fanfusionventures.com">info@fanfusionventures.com</a><a href="tel:+16199928420">+1 (619) 992 8420</a><a href="https://www.instagram.com/fanfusionmedia.io/" target="_blank" rel="noopener">@fanfusionmedia.io</a></div></section>`;const faq=()=>`<section class="section stack"><h2>FREQUENTLY ASKED QUESTIONS</h2>${[['How does Dropbox work?','Purchase a separate subscription. Our team manually sends a Dropbox invitation to your designated email. No guaranteed activation timeframe yet.'],['Is VIP included with Dropbox?','No. Subscriptions are separate.'],['Can I cancel?','Yes, recurring billing stops at the end of your paid period. Refunds subject to applicable law and service availability.'],['Are forecasts guaranteed?','No. Forecasts are uncertain estimates. Demo forecasts are not real analysis.']].map(([q,a])=>`<details class="card"><summary>${q}</summary><p style="margin-top:10px">${a}</p></details>`).join('')}</section>`;
function dropbox(){return `<div class="${role==='public'?'section':'stack'}"><div class="sectionhead"><span class="eyebrow">Creator access</span><h2>100,000+ SPORTS CLIPS.</h2><p>Your content. Our footage. The library lives on Dropbox, not this website.</p></div><div class="card stack"><div class="sportart" style="height:230px;font-size:64px">▷</div><h3>FANFUSION SHOWREEL</h3>${db.settings.video?`<video controls style="width:100%;max-height:400px" src="${esc(db.settings.video)}"></video>`:'<p>Sample video placeholder — upload an authorized showreel from the admin homepage editor. No downloadable samples.</p>'}</div><h3 style="margin:22px 0 12px">WHAT'S INSIDE OUR DROPBOX</h3><div class="grid grid3">${[['NBA','🏀'],['NFL','🏈'],['NHL / Hockey','🏒'],['MLB','⚾'],['Golf','⛳'],['College Football','🏟']].map(([t,i])=>`<div class="card interactive"><div class="sportart">${i}</div><h3 style="margin-top:10px">${t}</h3></div>`).join('')}</div><div class="grid mobile-one" style="margin-top:18px">${['Monthly','Yearly'].map(p=>`<div class="card stack"><div class="eyebrow">${p}</div><h2>${p==='Monthly'?'$100 / month':db.settings.yearly?money(db.settings.yearly)+' / year':'Price TBD'}</h2><p>Recurring subscription · Separate from VIP · Manual invitation</p><button class="primary" onclick="checkout('Dropbox','${p}')">${isClips()?'View my subscription':'Select '+p}</button></div>`).join('')}</div></div>`}function vipPage(){return `<div class="${role==='public'?'section':'stack'}"><div class="sectionhead"><span class="eyebrow" style="color:var(--gold)">Exclusive membership</span><h2 style="color:var(--gold)">FANFUSION VIP</h2><p>Separate paid access to the VIP Picks channel. Choose your subscription period.</p></div><div class="grid grid3 mobile-one">${['Weekly','Monthly','Yearly'].map(p=>`<div class="card goldcard stack"><div class="eyebrow" style="color:var(--gold)">${p}</div><h2>${db.settings['vip'+p]?money(db.settings['vip'+p]):'TBD'}</h2><p>VIP badge · Exclusive channel · Auto-renewal</p><button class="gold" onclick="checkout('VIP','${p}')">Select ${p}</button></div>`).join('')}</div></div>`}function checkout(prod,plan){if(role==='public'){pending=prod==='VIP'?'vip':'dropbox';loginModal();return}if((prod==='VIP'&&isVIP())||(prod==='Dropbox'&&isClips())){go('subscriptions');return}let m=member(),price=prod==='Dropbox'?(plan==='Monthly'?100:Number(db.settings.yearly||0)):Number(db.settings['vip'+plan]||0);modal(`<h2>${esc(prod)} checkout</h2><div class="demo">DEMO ONLY. No card information, payment, real receipt or Dropbox invitation will be sent. Undecided prices use $0 for testing.</div><form class="form" style="margin-top:14px" onsubmit="event.preventDefault();payDemo(this,'${prod}','${plan}',${price})">${field('Full name','name',m.name)}${field('Registered email','email',m.email,'email')}${prod==='Dropbox'?field('Dropbox invitation email','invite',m.email,'email'):''}${field('Instagram (optional)','ig',m.ig||'')}${field('Discount code','promo')}<label>Payment method${select('method',['Credit / debit card','PayPal'])}</label><p>Initial price: ${price?money(price):'TBD (demo $0)'}. Discounts first payment only. Automatic renewal until cancelled.</p><label class="check"><input type="checkbox" required> I understand this is a simulated transaction.</label><button class="primary">Simulate payment</button></form>`)}function payDemo(f,prod,plan,price){let m=member(),d=fd(f);let promo=db.promos.find(p=>p.active&&p.code.toUpperCase()===d.promo.toUpperCase()&&[prod,'Both'].includes(p.product)&&(!p.expires||new Date(p.expires)>new Date()));if(d.promo&&!promo){toast('Invalid or inapplicable promo code');return}let amount=price*(1-(promo?.percent||0)/100),tx={id:'DEMO-'+id(),member:m.id,product:prod,plan,amount,date:now(),status:'Paid',method:d.method};db.transactions.push(tx);m[prod==='VIP'?'vip':'clips']=true;m.ig=d.ig;let ticket;if(prod==='Dropbox'){ticket={id:'FF-DBX-'+id().toUpperCase(),type:'Dropbox',member:m.id,email:d.invite||m.email,name:d.name,plan,amount,status:'Pending invitation',date:now()};db.tickets.unshift(ticket)}log('Simulated '+prod+' payment');modal(`<h2>Payment simulation complete</h2><p>${money(amount)} · ${esc(plan)} · ${esc(prod)}</p>${ticket?`<div class="card stack" style="margin:15px 0"><small>SUBSCRIPTION TICKET</small><h3>${esc(ticket.id)}</h3><p>Pending manual Dropbox invitation. No email is actually sent.</p></div>`:''}<button class="full" onclick="receipt('${tx.id}')">Download demo receipt</button><button class="primary full" style="margin-top:10px" onclick="closeModal();go('subscriptions')">My subscriptions</button>`)}function receipt(t){let x=db.transactions.find(a=>a.id===t);if(!x)return;downloadText('FANFUSION-'+x.id+'.txt',`FANFUSION — DEMO RECEIPT (NOT A REAL PAYMENT)\n${x.id}\n${x.product} ${x.plan}\n${money(x.amount)}\n${x.date}`)}function downloadText(name,data){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'text/plain'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}

function publisher(p=null){return wrap(`${title(p?'EDIT CONTENT':'PUBLISH CONTENT','Create Free Picks, VIP Picks or announcements.')}<div class="card stack"><form class="form" onsubmit="event.preventDefault();publishPost(this,${p?`'${p.id}'`:'null'})"><div class="grid"><label>Channel${select('channel',['free','vip','announcements'],p?.channel||'free')}</label><label>Sport${select('sport',sportsList,p?.sport||'NFL')}</label>${field('Analyst','analyst',p?.analyst||'FANFUSION')}<label>Multiple media display${select('layout',['Stacked','Carousel'],p?.layout||'Stacked')}</label></div>${field('Post title','title',p?.title||'')}${area('Post body','body',p?.body||'')}${field('External link (optional)','link',p?.link||'','url')}<label>Upload images / videos<input name="media" type="file" accept="image/*,video/*" multiple></label><label>Publish timing${select('timing',['Publish now','Schedule','Draft'])}</label>${field('Scheduled date / time (local demo)','schedule','','datetime-local')}${field('Timezone label','timezone',db.settings.timezone)}<button class="primary">${p?'Save changes':'Save post'}</button><p>Uploaded media is stored in this browser for the demo (small files only). Scheduled posts are checked when the prototype is open, not by a real server.</p></form></div>`)}async function readFiles(files){let out=[];for(const file of files||[]){if(file.size>2*1024*1024){toast('Skip files larger than 2 MB in prototype');continue}let src=await new Promise(res=>{let r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(file)});out.push({src,type:file.type,name:file.name})}return out}async function publishPost(f,pid){if(!adminGuard())return;let d=fd(f),old=db.posts.find(x=>x.id===pid);if(!d.title||!d.body){toast('Enter title and post body');return}if(d.timing==='Schedule'&&!d.schedule){toast('Choose a schedule time');return}let media=await readFiles(f.media.files),p={id:pid||id(),channel:d.channel,title:d.title,body:d.body,sport:d.sport,analyst:d.analyst,link:d.link,layout:d.layout,date:d.timing==='Schedule'?new Date(d.schedule).toISOString():now(),status:d.timing==='Schedule'?'Scheduled':d.timing==='Draft'?'Draft':'Published',media:media.length?media:old?.media||[],reactions:old?.reactions||{},edited:!!old,history:old?[...(old.history||[]),{date:now(),title:old.title,body:old.body}]:[]};if(old)db.posts=db.posts.map(x=>x.id===pid?p:x);else db.posts.unshift(p);db.media.push(...media);log((old?'Edited ':'Created ')+p.channel+' post');closeModal();go('posts');toast('Post saved: '+p.status)}function managePosts(){return wrap(`${title('MANAGE POSTS')}<div class="row"><button class="primary" onclick="go('publisher')">+ New post</button></div>${table(['Channel','Title','Sport','Status','Date','Actions'],db.posts.map(p=>[esc(p.channel),esc(p.title),esc(p.sport),status(p.status),esc(fmt(p.date)),`<div class="row"><button class="small" onclick="editPost('${p.id}')">Edit</button><button class="small" onclick="postStatus('${p.id}')">${p.status==='Published'?'Archive':'Publish'}</button><button class="small" onclick="postHistory('${p.id}')">History</button></div>`]))}`)}function editPost(i){let p=db.posts.find(x=>x.id===i);modal(publisher(p))}function postStatus(i){let p=db.posts.find(x=>x.id===i);p.status=p.status==='Published'?'Archived':'Published';log('Post status: '+p.status);render()}function postHistory(i){let p=db.posts.find(x=>x.id===i);modal(`<h2>Revision history</h2>${(p.history||[]).map(h=>`<div class="card"><small>${esc(fmt(h.date))}</small><h3>${esc(h.title)}</h3><p>${esc(h.body)}</p></div>`).join('')||empty('No previous revisions.')}`)}
function studio(){return wrap(`${title('FORECAST STUDIO','Create manual forecasts or generate a sample draft. Preview and edit before publishing.')}<div class="card stack"><form class="form" id="forecastForm" onsubmit="event.preventDefault();previewForecast(this)"><div class="grid"><label>Sport${select('sport',sportsList.slice(1),'NFL')}</label><label>Date window${select('day',['Today','Tomorrow','Upcoming'])}</label>${field('Team A','a','Cincinnati Bengals')}${field('Team B','b','Baltimore Ravens')}</div><h3>Forecast modules</h3><div class="row"><label class="check"><input type="checkbox" name="win" checked>Win probability</label><label class="check"><input type="checkbox" name="score">Score projection</label><label class="check"><input type="checkbox" name="player">Player performance</label><button type="button" class="small" onclick="['win','score','player'].forEach(k=>$('#forecastForm').elements[k].checked=true)">Select all</button></div><div class="grid">${field('Team A win % (0–100)','p',60,'number')}${field('Projected team A score','scoreA',27,'number')}${field('Projected team B score','scoreB',23,'number')}${field('Player projection','playerText','')}</div>${area('Matchup explanation','reason','Illustrative explanation only; live data is not connected.')}<div class="row"><button type="button" onclick="generateDraft()">Generate sample draft</button><button class="primary">Preview forecast</button></div></form><p>Automatic daily forecasts in production: win probability only, for enabled leagues, refreshed on significant verified changes. No AI or sports API is connected here.</p></div><h3>Published forecasts</h3>${table(['Sport','Matchup','Status','Modules','Action'],db.forecasts.map(f=>[esc(f.sport),esc(f.a+' vs '+f.b),status(f.status),esc(f.modules.join(', ')),`<div class="row"><button class="small" onclick="editForecast('${f.id}')">Edit</button><button class="small" onclick="toggleForecast('${f.id}')">${f.status==='Hidden'?'Show':'Hide'}</button>${f.status= function membersAdmin(kind='all'){let rows=db.members.filter(m=>(kind==='vip'?m.vip:true)&&(!filter.query||[m.name,m.email,m.username,m.id].some(s=>s.toLowerCase().includes(filter.query.toLowerCase()))));return wrap(`${title(kind==='vip'?'VIP SUBSCRIPTION MANAGEMENT':'MEMBER MANAGEMENT')}<div class="row"><input style="max-width:350px" placeholder="Search name, email, ID" value="${esc(filter.query)}" onchange="filter.query=this.value;render()"><button onclick="exportMembers()">Export CSV</button></div>${table(['Member','Email','Country','VIP','Dropbox','Status','Actions'],rows.map(m=>[esc(m.username+' · '+m.id),esc(m.email),esc(m.country),m.vip?'✓':'—',m.clips?'✓':'—',status(m.status),`<button class="small" onclick="memberModal('${m.id}')">Manage</button>`]))}`)}function memberModal(i){let m=db.members.find(x=>x.id===i);modal(`<h2>${esc(m.name)}</h2><p>${esc(m.email)} · ${esc(m.id)}</p><form class="form" style="margin-top:12px" onsubmit="event.preventDefault();saveMember(this,'${i}')"><label>Account status${select('status',['Active','Suspended','Banned'],m.status)}</label><label class="check"><input type="checkbox" name="vip" ${m.vip?'checked':''}>VIP access</label><label class="check"><input type="checkbox" name="clips" ${m.clips?'checked':''}>Dropbox subscriber</label>${field('Complimentary access expiry (optional)','expiry',m.expiry||'','date')}${field('Reason / note','note',m.note||'')}<button class="primary">Save access</button></form><p>Changing Dropbox status creates an admin task when manual invitation or removal is required.</p>`)}function saveMember(f,i){let m=db.members.find(x=>x.id===i),d=fd(f),before=m.clips;Object.assign(m,{vip:!!d.vip,clips:!!d.clips,status:d.status,expiry:d.expiry,note:d.note});if(m.clips&&!before)db.tickets.unshift({id:'FF-DBX-'+id().toUpperCase(),type:'Dropbox',member:m.id,email:m.email,name:m.name,plan:'Complimentary',amount:0,status:'Pending invitation',date:now()});if(before&&(!m.clips||m.status!=='Active'))db.tickets.filter(t=>t ()+`<div class="hero" style="min-height:75vh;justify-content:center;text-align:center">${stadium}<div class="hero-inner"><h1>WE'RE IN THE LAB.</h1><p>${esc(db.settings.maintenanceMessage)}</p><button onclick="loginModal()">Admin demo login</button></div></div>`;return}app.innerHTML=header()+demo()+publicContent()+footer();let hero=$('.hero');if(hero&&db.settings.heroImage)hero.style.backgroundImage=`url(${db.settings.heroImage})`;return}let nav=role==='admin'?navAdmin:navMember;app.innerHTML=`<div class="shell"><aside class="side ${menu?'open':''}"><div class="row between">${logo()}<button class="navclose" onclick="menu=false;render()">✕</button></div><div class="navlabel">${role==='admin'?'Administration':'Member portal'}</div>${ffNav(nav)}<div class="navlabel">Demo account</div><button onclick="logout()">↪ Log out / switch account</button></aside><main class="main"><header class="dashhead"><div class="row"><button class="mobile-menu" aria-label="Open main menu" onclick="menu=!menu;render()">☰ <span>Menu</span></button><div><b>${esc(nav.find(n=>n[1]===page)?.[0]||'Dashboard')}</b><div class="muted">${role==='admin'?'Admin control center':'Member portal'} · prototype</div></div></div><div class="row"><span class="tag ${role==='member'&&isVIP()?'goldtag':''}">${role==='admin'?'ADMIN':isVIP()?'VIP PICKS':'MEMBER'}${role==='member'&&isClips()?' + DROPBOX':''}</span>${role==='member'?'<button class="small" onclick="go(\'notifications\')">◌</button>':''}<button class="v6-searchbtn" onclick="v6Search()" aria-label="Search website">⌕ <span>Search</span></button><button class="small" onclick="logout()">Switch account ↗</button></div></header><div class="dashbody"><div class="demo" style="margin-bottom:16px">DEMO V8 · Local data only. No real payments, authentication or live feeds.</div>${role==='admin'?adminContent():memberContent()}</div></main></div><nav class="bottomnav">${(role==='admin'?[['Home','overview','⌂'],['Channels','publisher','✎'],['Studio','studio','◉'],['Members','members','◎']]:[['Home','dashboard','⌂'],['Free','free','▤'],['VIP','vip','♛'],['Insights','insights','◉']]).map(([n,p,i])=>`<button onclick="go('${p}')"><span>${i}</span>${n}</button>`).join('')}<button onclick="menu=!menu;render()"><span>☰</span>More</button></nav>`}function checkScheduled(){let changed=false;db.posts.forEach(p=>{if(p.status==='Scheduled'&&new Date(p.date)<=new Date()){p.status='Published';changed=true}});if(changed){save();render()}}

function ffNav(nav){

const direct=role==='admin'?['overview','tasks']:['dashboard'];
const item=p=>{let n=nav.find(x=>x[1]===p);if(!n)return '';let count=role==='member'&&['free','vip','announcements'].includes(p)&&(p!=='vip'||isVIP())?unread(p):0;return `<button class="ff-nav-item ${page===p?'active':''}" onclick="go('${p}')"><span class="navicon" style="${p==='vip'?'color:var(--gold)':''}">${n[2]}</span><span>${esc(n[0])}</span>${count?`<span class="unread">${count}</span>`:''}</button>`};

}

performance=function(admin=false){let all=db.records,days={Weekly:7,Monthly:30,Yearly:365}[ffPeriod],base=new Date(Math.max(Date.now(),...all.map(r=>Date.parse(r.date)||0))),cut=new Date(base.getTime()-(days-1)*86400000).toISOString().slice(0,10),rows=all.filter(r=>r.date>=cut&&(filter.sport==='All'||r.sport===filter.sport)&&(filter.analyst==='All'||r.analyst===filter.analyst));let settled=rows.filter(r=>['Win','Loss','Void','Push'].includes(r.result)).sort((a,b)=>a.date.localeCompare(b.date)),running=0,pts=[0,...settled.map(r=>running+=Number(r.profit)||0)],min=Math.min(...pts,0),max=Math.max(...pts,0),range=max-min||1,x=i=>38+i*525/Math.max(1,pts.length-1),y=v=>22+(max-v)*138/range;let path=pts.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');let graph=`<div class="card stack"><div class="row between"><div><h3>NET PERFORMANCE · ${ffPeriod.toUpperCase()}</h3><small>Cumulative sample profit / loss · ${cut} onwards</small></div><h2 style="color:${running>=0?'var(--green)':'var(--red)'}">${money(running)}</h2></div><svg class="ff-chart" viewBox="0 0 600 195" role="img" aria-label="Cumulative sample profit and loss"><path d="M38 ${y(0)}H563" stroke="#61566d" stroke-dasharray="5 5"/><text x="4" y="${y(0)+4}" font-size="10" fill="#aaa">$0</text><path d="${path}" stroke="${running>=0?'#65d6a1':'#f28b9b'}" stroke-width="3" fill="none" stroke-linejoin="round"/>${pts.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="#c4a5ff"><title>${money(v)}</title></circle>`).join('')}<text x="38" y="185" font-size="11" fill="#aaa">Start</text><text x="563" y="185" text-anchor="end" font-size="11" fill="#aaa">Latest</text></svg><p>${settled.length?`${settled.filter(r=>r.result==='Win').length} wins and ${settled.filter(r=>r.result==='Loss').length} losses. The line rises on profitable sample outcomes and falls on losses.`:'No settled records in this period.'} All numbers are synthetic; not a claim of actual FANFUSION performance.</p></div>`;

function v7Graph(series){let mn=Math.min(0,...series),mx=Math.max(0,...series),rg=mx-mn||1,y=v=>18+(mx-v)*110/rg,x=i=>30+i*495/Math.max(1,series.length-1),p=series.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join(' ');return `<svg viewBox="0 0 550 155" role="img" aria-label="Cumulative recorded net performance"><path d="M30 ${y(0)}H525" stroke="#766b88" stroke-dasharray="5 5"/><path d="${p}" fill="none" stroke="#b694f5" stroke-width="3"/>${series.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.5" fill="#d5bdff"><title>${money(v)}</title></circle>`).join('')}<text x="30" y="148" fill="#a49db1" font-size="10">Start</text><text x="525" y="148" fill="#a49db1" font-size="10" text-anchor="end">Latest</text></svg>`}
function v7MetricCards(s){return `<div class="grid grid4">${stat('Settled records',s.settled)}${stat('Win rate (excl. push/void)',s.rate===null?'—':s.rate.toFixed(1)+'%')}${stat('Known net P/L',money(s.profit))}${stat('Known ROI',s.roi===null?'—':s.roi.toFixed(1)+'%')}${stat('Wins / losses',s.wins+' / '+s.loss)}${stat('Pending',s.pending)}${stat('Net units ($100/unit)',(s.profit/100).toFixed(2)+'u')}${stat('Max drawdown',money(s.draw))}</div>`}
performance=function(admin=false){let rows=v7RecordRows(),s=v7Stats(rows);return wrap(`${title('PERFORMANCE TRACKER 2.0','Historical recordkeeping · all existing records are demo samples, not verified real-world results.')}<div class="tabs">${['Weekly','Monthly','Yearly','All-time','Custom'].map(p=>`<button class="${v7RecordFilter.period===p?'active':''}" onclick="v7SetRec('period','${p}')">${p}</button>`).join('')}</div><div class="card v7-filtergrid">${v7Select('Channel','channel',['All','Free','VIP','Unassigned'])}${v7Select('Analyst','analyst',['All',...new Set([...v7Analysts,...db.records.map(r=>r.analyst)])])}${v7Select('Sport','sport',sportsList)}${v7Select('Result','result',['All','Pending','Win','Loss','Push','Void'])}${v7RecordFilter.period==='Custom'?`<label>From<input type="date" value="${esc(v7RecordFilter.from)}" onchange="v7SetRec('from',this.value)"></label><label>To<input type="date" value="${esc(v7RecordFilter.to)}" onchange="v7SetRec('to',this.value)"></label>`:''}</div>${v7MetricCards(s)}<div class="card stack"><h3>Historical net performance</h3>${v7Graph(s.series)}<p>${s.unknown} settled record(s) have unavailable P/L and are excluded from net and ROI. Units use a fixed $100 reference; no wagering recommendation.</p></div><div class="row">${admin?'<button class="primary" onclick="v7RecordModal()">+ Historical record</button>':''}<button onclick="v7ExportRecords()">Export filtered CSV</button></div><div class="v7-records">${rows.map(r=>`<div class="card v7-record"><div class="row between"><span class="eyebrow">${esc(r.sport)} · ${esc(r.channel||'Unassigned')}</span>${status(r.result)}</div><h3>${esc(r.pick)}</h3><p>${esc(r.analyst)} · ${esc(r.date)}</p><div class="v7-recordmeta"><span>Stake <b>${money(r.stake)}</b></span><span>Odds <b>${esc(r.odds||'Unavailable')}</b></span><span>Net <b>${r.profit===null||r.result==='Pending'?'—':money(r.profit)}</b></span></div><small>${r.source?'Source recorded · not independently verified':'Sample / source not supplied'}</small><div class="row"><button class="small" onclick="v7RecordDetail('${v7SafeId(r.id)}')">Details</button>${admin?`<button class="small" onclick="v7RecordModal('${v7SafeId(r.id)}')">Edit / settle</button>`:''}</div></div>`).join('')||empty('No matching records. Try another date range.')}</div>`)}
function v7RecordModal(rid='',postid=''){if(!adminGuard())return;let r=db.records.find(x=>x.id===rid)||{},p=db.posts.find(x=>x.id===postid);modal(`<h2>${rid?'Edit historical record':'Add historical record'}</h2><p>Use actual recorded odds only. Leave unknown odds blank; no fabricated results.</p><form class="form" onsubmit="event.preventDefault();v7SaveRecord(this,'${v7SafeId(rid)}')"><div class="grid mobile-one">${field('Date','date',r.date||new Date().toISOString().slice(0,10),'date')}<label>Analyst${select('analyst',v7Analysts,r.analyst||p?.analyst||'FANFUSION')}</label><label>Sport${select('sport',sportsList.slice(1),r.sport||p?.sport||'NBA')}</label><label>Channel${select('channel',['Unassigned','Free','VIP'],r.channel||(p?.channel==='vip'?'VIP':p?.channel==='free'?'Free':'Unassigned'))}</label>${field('Historical description','pick',r.pick||p?.title||'')}${field('Recorded odds (+150, -110, 1.91x)','odds',r.odds||'')}${field('Recorded stake ($)','stake',r.stake??100,'number')}<label>Settlement${select('result',['Pending','Win','Loss','Push','Void'],r.result||'Pending')}</label></div>${field('Result evidence / source URL (optional)','source',r.source||'','url')}${field('Original post ID (optional)','postid',r.postid||postid)}${area('Settlement note','note',r.note||'')}<p>Net result is calculated from recorded stake, odds and settlement. A win with missing odds has unavailable profit.</p><button class="primary">Save historical record</button></form>`)}
function v7SaveRecord(form,rid){if(!adminGuard())return;let d=fd(form),stake=Number(d.stake),old=db.records.find(r=>r.id===rid);if(!d.date||!d.pick.trim()||!Number.isFinite(stake)||stake<=0)return toast('Enter valid date, description and positive stake');if(d.odds.trim()&&!(/^[+-]\d+(\.\d+)?$/.test(d.odds.trim())&&Math.abs(Number(d.odds))>=100||/^\d+(\.\d+)?x?$/i.test(d.odds.trim())&&Number(d.odds.replace(/x$/i,''))>1&&!/^[+-]/.test(d.odds.trim())))return toast('Use valid American odds or decimal multiplier, or leave blank');if(d.postid&&!db.posts.some(p=>p.id===d.postid))return toast('Original post ID not found');if(d.source&&!/^https?:\/\//i.test(d.source))return toast('Use an http or https evidence URL');let r={...d,id:rid||id(),stake,profit:v7Calc(stake,d.odds,d.result),updated:now(),history:old?[...(old.history||[]),{date:now(),result:old.result,odds:old.odds,stake:old.stake,profit:old.profit}]:[]};if(old)db.records=db.records.map(x=>x.id===rid?r:x);else db.records.unshift(r);log('Saved historical record '+r.id);closeModal();render();toast('Record saved')}
function v7RecordDetail(rid){let r=db.records.find(x=>x.id===rid);if(!r)return;let p=db.posts.find(x=>x.id===r.postid),can=p&&p.status==='Published'&&(p.channel!=='vip'||role==='admin'||isVIP());modal(`<div class="stack"><h2>${esc(r.pick)}</h2>${status(r.result)}<p>${esc(r.analyst)} · ${esc(r.date)} · ${esc(r.channel||'Unassigned')}</p><p>Recorded odds: ${esc(r.odds||'Unavailable')} · stake ${money(r.stake)} · net ${r.profit===null||r.result==='Pending'?'Unavailable':money(r.profit)}</p>${r.source&&/^https?:\/\//i.test(r.source)?`<a href="${esc(r.source)}" target="_blank" rel="noopener">Recorded settlement evidence ↗</a>`:'<p>No independent evidence attached.</p>'}${r.note?`<p>${esc(r.note)}</p>`:''}${can?`<button onclick="closeModal();v7JumpPost('${p.channel}','${v7SafeId(p.id)}')">View original post</button>`:''}<h3>Revision history</h3>${(r.history||[]).map(h=>`<small>${esc(fmt(h.date))} · ${esc(h.result)} · ${esc(h.odds||'Unavailable')} · ${h.profit===null?'—':money(h.profit)}</small>`).join('')||'<p>No prior revisions.</p>'}</div>`)}
const v7CSV=rows=>rows.map(r=>r.map(x=>{let s=String(x??'');if(/^[=+@\-\t\r]/.test(s)&&!/^[-+]?\d+(\.\d+)?$/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}).join(',')).join('\n');
function v7ExportRecords(){downloadText('fanfusion-demo-performance.csv',v7CSV([['Date','Analyst','Sport','Channel','Description','Odds','Stake','Settlement','Net','Evidence'],...v7RecordRows().map(r=>[r.date,r.analyst,r.sport,r.channel||'Unassigned',r.pick,r.odds,r.stake,r.result,r.profit,r.source])]))}
let v7AnalystName='';
function v7Analyst(n){v7AnalystName=n;go('analysts')}
function v7AnalystsPage(){let names=[...new Set([...v7Analysts,...db.records.map(r=>r.analyst)])],n=v7AnalystName,rs=db.records.filter(r=>r.analyst===n);return wrap(`${title('ANALYST DIRECTORY','Browse complete local demo records by analyst. No rankings or verified performance claims.')}<div class="grid grid3 mobile-one">${names.map((a,i)=>{let s=v7Stats(db.records.filter(r=>r.analyst===a));return `<button class="card v7-analyst ${n===a?'v7-selected':''}" onclick="v7Analyst(${esc(JSON.stringify(a))})"><span class="v7-monogram">${esc(a.slice(0,2))}</span><h3>${esc(a)}</h3><small>${s.settled} sample settled records</small></button>`}).join('')}</div>${n?`<div class="card stack"><h2>${esc(n)}</h2><p>Specialization and biography to be supplied by the team.</p>${v7MetricCards(v7Stats(rs))}<button onclick="v7RecordFilter.analyst=v7AnalystName;v7RecordFilter.period='All-time';go('${role==='admin'?'records':'performance'}')">View complete record ↗</button><h3>Recent accessible posts</h3>${db.posts.filter(p=>p.analyst===n&&p.status==='Published'&&(p.channel!=='vip'||role==='admin'||isVIP())).slice(0,5).map(p=>`<button class="v7-line" onclick="v7JumpPost('${p.channel}','${v7SafeId(p.id)}')">${esc(p.title||p.body.slice(0,60))}</button>`).join('')||'<p>No accessible posts.</p>'}</div>`:''}`)}
postCard=function(p){let h=v7OldPost(p),rs=db.records.filter(r=>r.postid===p.id);return h.replace('</article>',`${rs.map(r=>`<button class="v7-line" onclick="v7RecordDetail('${v7SafeId(r.id)}')">Historical record · ${esc(r.result)} ↗</button>`).join('')}${role==='admin'&&['free','vip'].includes(p.channel)?`<button class="small" onclick="v7RecordModal('','${v7SafeId(p.id)}')">Link historical record</button>`:''}</article>`)}
let v7ArchiveFilter='All',v7ArchiveQ='';
function v7Archive(){let admin=role==='admin',list=db.posts.filter(p=>(admin||p.status==='Published')&&(admin||p.channel!=='vip'||isVIP())&&(v7ArchiveFilter==='All'||p.channel===v7ArchiveFilter)&&(!v7ArchiveQ||(`${p.title} ${p.body} ${p.analyst}`).toLowerCase().includes(v7ArchiveQ.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date));return wrap(`${title('CHANNEL ARCHIVE','Find previous posts, associated records and publication dates.')}<div class="card stack"><div class="tabs">${['All','free',...(admin||isVIP()?['vip']:[]),'announcements'].map(ch=>`<button class="${v7ArchiveFilter===ch?'active':''}" onclick="v7ArchiveFilter='${ch}';render()">${ch==='All'?'All':ch==='free'?'Free':ch==='vip'?'VIP':'News'}</button>`).join('')}</div><form class="row" onsubmit="event.preventDefault();v7ArchiveQ=this.q.value;render()"><input name="q" placeholder="Search archive" value="${esc(v7ArchiveQ)}"><button>Search</button></form></div>${list.map(p=>`<div class="card stack"><div class="row between"><span class="tag">${esc(p.channel)} · ${esc(p.analyst)}</span><small>${v7Date(p.date)}</small></div><h3>${esc(p.title||p.body.slice(0,80))}</h3><p>${esc(p.body.slice(0,180))}</p><small>${esc(p.status)} · ${db.records.filter(r=>r.postid===p.id).length} linked record(s)</small><div class="row">${p.status==='Published'?`<button class="small" onclick="v7JumpPost('${p.channel}','${v7SafeId(p.id)}')">Open post</button>`:''}${admin?`<button class="small" onclick="postHistory('${v7SafeId(p.id)}')">Revision history</button><button class="small" onclick="editPost('${v7SafeId(p.id)}')">Edit</button>`:''}</div></div>`).join('')||empty('No matching archive posts.')}`)}
let v7MatchId='',v7MatchTab='Overview';
function v7OpenMatch(i){v7MatchId=i;v7MatchTab='Overview';go('matchup')}
function v7MatchPage(){let fs=db.forecasts.filter(f=>f.status!=='Hidden'),f=fs.find(f=>f.id===v7MatchId)||fs[0];if(!f)return empty('No matchup records available.');let tab=v7MatchTab;return wrap(`${title('MATCHUP CENTER','Individual matchup detail · demo data only.')}<button onclick="go('${role==='admin'?'studio':'insights'}')">← All matchups</button><div class="card stack"><div class="row between"><span class="tag">${esc(f.sport)}</span><small>${esc(f.status)} · ${v7Date(f.date)}</small></div><div class="v7-matchteams"><div>${ffTeamLogo(f.a)}<h3>${esc(f.a)}</h3></div><b>VS</b><div>${ffTeamLogo(f.b)}<h3>${esc(f.b)}</h3></div></div>${f.modules.includes('win')?`<div class="row between"><h2>${f.p}%</h2><h2>${100-f.p}%</h2></div><div class="v6-split"><i style="width:${Math.max(0,Math.min(100,f.p))}%"></i></div>`:''}<div class="tabs">${['Overview','Form','Injuries','Stats','History'].map(t=>`<button class="${tab===t?'active':''}" onclick="v7MatchTab='${t}';render()">${t}</button>`).join('')}</div>${tab==='Overview'?`<p>${esc(f.reason)}</p>${f.modules.includes('score')?`<p>Sample score projection: ${esc(f.scoreA)} – ${esc(f.scoreB)}</p>`:''}${f.modules.includes('player')?`<p>${esc(f.player)}</p>`:''}<small>Updated ${esc(fmt(f.date))} · source: ${esc(f.source||'Demo')}</small>`:tab==='History'?`<h3>Recorded forecast history</h3>${(f.history||[]).map(h=>`<p>${esc(fmt(h.date))} · ${esc(JSON.stringify(h))}</p>`).join('')||'<p>No locked historical revisions supplied.</p>'}${f.result?`<p>Sample settlement: ${esc(f.result)}</p>`:''}`:`<h3>${tab==='Form'?'Recent form':tab==='Injuries'?'Player availability':'Team statistics'}</h3><p>Verified ${tab.toLowerCase()} data is not connected. No fabricated live statistics.</p>`}<small>Forecasts are uncertain; this is not real-time analysis.</small></div>`)}

const v7OldResults=v6Results;v6Results=function(){v7OldResults();let e=document.getElementById('v6Results');if(!e||role==='public')return;let q=v6SearchText.trim().toLowerCase();if(q){let hits=db.forecasts.filter(f=>f.status!=='Hidden'&&(`${f.a} ${f.b} ${f.sport}`).toLowerCase().includes(q));if(hits.length)e.insertAdjacentHTML('afterbegin',hits.map(f=>`<button class="v6-searchresult" onclick="closeModal();v7OpenMatch('${v7SafeId(f.id)}')">${esc(f.a+' vs '+f.b)}<small>Open detail ↗</small></button>`).join(''))}}
v6Jump=function(p,i){closeModal();v6ChannelQuery='';go(p);if(i)document.getElementById('v6-post-'+i)?.scrollIntoView({block:'center'});if(p==='insights'){filter.day='All';render()}}
function v7AddPeriod(date,plan){let d=new Date(date);if(!Number.isFinite(+d))return null;if(plan==='Weekly')d.setUTCDate(d.getUTCDate()+7);else{let day=d.getUTCDate();d.setUTCDate(1);if(plan==='Yearly'||plan==='Annually')d.setUTCFullYear(d.getUTCFullYear()+1);else d.setUTCMonth(d.getUTCMonth()+1);let max=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,0)).getUTCDate();d.setUTCDate(Math.min(day,max))}return d.toISOString()}
function v7Plan(m,prod){return m?.v7Plans?.[prod]||null}
function v7PlanActive(m,prod){let p=v7Plan(m,prod),flag=prod==='VIP'?m?.vip:m?.clips;if(!m||m.status!=='Active')return false;if(prod==='VIP'&&Date.parse(m.bonusUntil||'')>Date.now())return true;if(!flag)return false;if(m.expiry&&Date.parse(m.expiry+'T23:59:59Z')<Date.now())return false;return !p||Date.parse(p.end)>Date.now()}
function v7PlanPrice(prod,plan){return prod==='Dropbox'?(plan==='Monthly'?100:Number(db.settings.yearly||1000)):Number(db.settings['vip'+plan]||0)}
payDemo=function(form,prod,plan,price){let m=member(),before=db.transactions.length;v7OldPay(form,prod,plan,price);if(db.transactions.length>before){m.v7Plans||={};let tx=db.transactions.at(-1),start=tx.date; m.v7Plans[prod]={plan,start,end:v7AddPeriod(start,plan),renewal:price,cancel:false};m[prod.toLowerCase()+'Cancel']=false;v7Event('subscription',prod);save()}}
saveMember=function(form,i){if(!adminGuard())return;v7OldSaveMember(form,i);let m=db.members.find(x=>x.id===i);if(m){m.v7Plans||={};if(m.vip&&!v7PlanActive(m,'VIP'))delete m.v7Plans.VIP;if(m.clips&&!v7PlanActive(m,'Dropbox'))delete m.v7Plans.Dropbox;save()}}
function v7Renew(prod){let m=member(),p=v7Plan(m,prod);if(!p||p.cancel)return toast('Renewal is disabled');let start=new Date(Math.max(Date.now(),Date.parse(p.end)||0)).toISOString();p.start=start;p.end=v7AddPeriod(start,p.plan);db.transactions.push({id:'DEMO-'+id(),member:m.id,product:prod,plan:p.plan,amount:p.renewal,date:now(),status:'Paid',method:'Simulated renewal'});m[prod==='VIP'?'vip':'clips']=true;log('Simulated '+prod+' renewal');render();toast('Demo renewal recorded; no charge')}
cancelDemo=function(prod){let m=member(),p=v7Plan(m,prod),key=prod.toLowerCase()+'Cancel';m[key]=!m[key];if(p)p.cancel=m[key];log('Changed demo renewal for '+prod);render();toast(m[key]?'Renewal disabled; paid access lasts until expiry':'Demo renewal enabled')}
function v7Order(t){let s=t.status,steps=['Subscription ticket created','Invitation pending','Invitation sent','Access confirmed'],idx=s==='Access confirmed'?3:s==='Invitation sent'?2:s==='Pending invitation'?1:0;return `<div class="card stack"><div class="row between"><b>${esc(t.id)}</b>${status(s)}</div><p>${esc(t.email)} · ${esc(t.plan||'')}</p><div class="v7-order">${steps.map((n,i)=>`<div><span class="${i<=idx?'v7-done':''}">${i<=idx?'✓':i+1}</span><p>${n}</p></div>`).join('')}</div>${/remov/i.test(s)?'<p>Access removal status overrides the invitation timeline.</p>':''}<small>Manual Dropbox invitation. No real action in this demo.</small></div>`}
subscriptions=function(){let m=member(),tx=db.transactions.filter(t=>t.member===m.id),tickets=db.tickets.filter(t=>t.member===m.id&&t.type==='Dropbox');return wrap(`${title('MY SUBSCRIPTIONS','Billing and access simulation. No real charges.')}<div class="grid mobile-one">${['VIP','Dropbox'].map(prod=>{let p=v7Plan(m,prod),active=v7PlanActive(m,prod),cancel=m[prod.toLowerCase()+'Cancel'];return `<div class="card stack ${prod==='VIP'?'goldcard':''}"><div class="row between"><h3>${prod}</h3>${status(active?'Active':p?'Expired':'Not subscribed')}</div><p>${p?esc(p.plan):active?'Demo complimentary access':'Choose a subscription'}</p>${p?`<div class="row between"><small>Access period ends</small><b>${v7Date(p.end)}</b></div><div class="row between"><small>Next renewal</small><b>${cancel?'Cancelled':v7Date(p.end)}</b></div><div class="row between"><small>Renewal amount</small><b>${money(p.renewal)}</b></div>`:''}${prod==='VIP'&&m.bonusUntil?`<p>Bonus VIP through ${v7Date(m.bonusUntil)}. Reward credit is simulated separately from billing.</p>`:''}${active||p?`<button onclick="cancelDemo('${prod}')">${cancel?'Resume':'Cancel'} renewal</button>${p&&!cancel?`<button onclick="v7Renew('${prod}')">Simulate next renewal</button>`:''}`:`<button class="primary" onclick="go('${prod==='VIP'?'vip':'dropbox'}')">Explore plans</button>`}</div>`}).join('')}</div><h3>Dropbox access tracking</h3>${tickets.map(v7Order).join('')||empty('No creator subscription tickets.') }<h3>Billing history</h3>${table(['Date','Product','Amount','Receipt'],tx.map(t=>[v7Date(t.date),esc(t.product),money(t.amount),`<button class="small" onclick="receipt('${v7SafeId(t.id)}')">Receipt</button>`]))}`)}
dropbox=function(){let h=v7OldDrop();return h+`<div class="${role==='public'?'section':'stack'}"><div class="card stack"><h2>Creator library guide</h2><div class="grid grid3 mobile-one">${[['Quality','4K collection; individual file resolution may vary.'],['Categories','Game action, highlights, interviews and celebrations; availability to be confirmed.'],['File formats','Catalog and verified file formats to be supplied.']].map(([k,v])=>`<div><h3>${k}</h3><p>${v}</p></div>`).join('')}</div><p>Collection photos are illustrative, not downloadable footage. Rights to use third-party sports footage must be confirmed separately.</p>${role==='member'?`<button onclick="go('subscriptions')">Track my Dropbox invitation</button>`:''}</div></div>`}
dropTicket=function(i){let t=db.tickets.find(x=>x.id===i);if(!t)return;modal(`<h2>Dropbox access review</h2>${v7Order(t)}<div class="stack"><button onclick="copyText(${esc(JSON.stringify(t.email))})">Copy invitation email</button><button onclick="setDrop('${v7SafeId(i)}','Invitation sent')">Mark invitation sent</button><button class="primary" onclick="setDrop('${v7SafeId(i)}','Access confirmed')">Confirm access</button><button onclick="setDrop('${v7SafeId(i)}','Access removal required')">Flag removal</button><button class="danger" onclick="setDrop('${v7SafeId(i)}','Access removed')">Mark removed</button></div>`)}
setDrop=function(i,s){if(!adminGuard())return;v7OldSetDrop(i,s);let t=db.tickets.find(x=>x.id===i);if(t){t.updated=now();if(s==='Access removed'){let m=db.members.find(m=>m.id===t.member);if(m)m.clips=false}save()}}
function v7Event(type,value=''){db.v7.events.push({type,value,date:now(),member:role==='member'?user?.id:null});if(db.v7.events.length>5000)db.v7.events.shift();save()}
function v7Business(){let paid=db.transactions.filter(t=>t.status==='Paid'),m=db.members.filter(x=>x.status==='Active'),paying=new Set(paid.filter(t=>Number(t.amount)>0).map(t=>t.member)),active=m.filter(x=>v7PlanActive(x,'VIP')||v7PlanActive(x,'Dropbox')),plans=m.flatMap(x=>['VIP','Dropbox'].map(prod=>({m:x,prod,p:v7Plan(x,prod)}))).filter(x=>x.p&&!x.p.cancel&&v7PlanActive(x.m,x.prod)),mrr=plans.reduce((s,x)=>s+x.p.renewal*(x.p.plan==='Weekly'?52/12:x.p.plan==='Yearly'?1/12:1),0);let promos=Object.entries(paid.reduce((a,t)=>{if(t.promo)a[t.promo]=(a[t.promo]||0)+1;return a},{}));return `<div class="card stack"><h3>Business health · local demo</h3><div class="grid grid4">${stat('Estimated active recurring revenue',money(mrr))}${stat('Active members with access',active.length)}${stat('Unique recorded paying members',paying.size)}${stat('Cancelled renewals',m.filter(x=>x.vipCancel||x.dropboxCancel).length)}</div><p>MRR uses recorded recurring plans only; legacy complimentary accounts excluded. No actual business revenue, churn or visitor conversion data is connected.</p><h3>Recorded promo usage</h3>${promos.map(([k,v])=>`<div class="row between"><span>${esc(k)}</span><b>${v}</b></div>`).join('')||'<p>No local promo redemptions recorded.</p>'}<h3>Campaign attribution</h3>${Object.entries(db.v7.events.filter(e=>e.type==='campaign').reduce((a,e)=>(a[e.value]=(a[e.value]||0)+1,a),{})).map(([k,v])=>`<div class="row between"><span>${esc(k)}</span><b>${v} local visit(s)</b></div>`).join('')||'<p>No tagged visits yet.</p>'}<button onclick="v7ExportBusiness()">Export local analytics</button></div>`}
function v7ExportBusiness(){downloadText('fanfusion-demo-analytics.csv',v7CSV([['Date','Product','Plan','Amount','Status','Promo'],...db.transactions.map(t=>[t.date,t.product,t.plan,t.amount,t.status,t.promo])]))}
overview=function(){return v7OldOverview()+v7Business()+`<div class="row">${v7Button('Content calendar','marketing')}${v7Button('Analytics reports','revenue')}</div>`}
revenue=function(){return v7OldRevenue()+v6RevenueGraph()+v7Business()}
let v7CalMonth=new Date().toISOString().slice(0,7),v7CalSelected='';
function v7Calendar(){let d=new Date(v7CalMonth+'-01T00:00:00Z'),y=d.getUTCFullYear(),m=d.getUTCMonth(),len=new Date(Date.UTC(y,m+1,0)).getUTCDate(),offset=d.getUTCDay(),posts=db.posts.filter(p=>p.date?.startsWith(v7CalMonth)),notes=db.v7.notes.filter(n=>n.date.startsWith(v7CalMonth));return wrap(`${title('MARKETING & CONTENT CENTER','Plan posts, promotions and campaigns in the local demo.')}<div class="row">${v7Button('Publish','publisher')}${v7Button('Manage posts','posts')}${v7Button('Media library','media')}${v7Button('Homepage','homepage')}${v7Button('Discounts','promos')}${v7Button('Giveaways','giveadmin')}</div><div class="card stack"><div class="row between"><button onclick="v7MoveMonth(-1)">←</button><h3>${esc(d.toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'}))}</h3><button onclick="v7MoveMonth(1)">→</button></div><div class="v7-calendar">${['S','M','T','W','T','F','S'].map(x=>`<small>${x}</small>`).join('')}${Array(offset).fill('<span></span>').join('')}${Array.from({length:len},(_,i)=>{let day=v7CalMonth+'-'+String(i+1).padStart(2,'0'),n=posts.filter(p=>p.date.slice(0,10)===day).length+notes.filter(n=>n.date===day).length;return `<button class="${v7CalSelected===day?'v7-selected':''}" onclick="v7CalSelected='${day}';render()">${i+1}${n?`<small>${n}</small>`:''}</button>`}).join('')}</div><p>Dates in UTC · select a day to inspect its posts or add a planning note.</p><h3>${v7CalSelected||'Select a day'}</h3>${posts.filter(p=>p.date.slice(0,10)===v7CalSelected).map(p=>`<button class="v7-line" onclick="editPost('${v7SafeId(p.id)}')">${esc(p.title||p.body.slice(0,50))} · ${esc(p.status)}</button>`).join('')}${notes.filter(n=>n.date===v7CalSelected).map(n=>`<div class="row between"><span>${esc(n.text)}</span><button class="small" onclick="v7RemoveNote('${v7SafeId(n.id)}')">Remove</button></div>`).join('')}${v7CalSelected?`<form class="form" onsubmit="event.preventDefault();v7SaveNote(this)"><label>Planning note<input name="note" required maxlength="160"></label><button>Add note</button></form>`:''}</div><div class="card stack"><h3>Campaign link builder</h3><p>Generate a demo link with a campaign tag. Only visits in this browser are counted.</p><form class="form" onsubmit="event.preventDefault();v7Link(this)"><label>Campaign name<input name="campaign" required maxlength="80" placeholder="instagram-holiday"></label><button>Generate & copy link</button></form><p id="v7LinkOut"></p></div>`)}
function v7MoveMonth(n){let d=new Date(v7CalMonth+'-01T00:00:00Z');d.setUTCMonth(d.getUTCMonth()+n);v7CalMonth=d.toISOString().slice(0,7);v7CalSelected='';render()}
function v7SaveNote(form){if(!adminGuard()||!v7CalSelected)return;let t=form.note.value.trim();if(!t)return;db.v7.notes.push({id:id(),date:v7CalSelected,text:t});log('Added content planning note');render()}
function v7RemoveNote(i){if(!adminGuard())return;db.v7.notes=db.v7.notes.filter(n=>n.id!==i);save();render()}
function v7Link(f){let t=f.campaign.value.trim();if(!t)return;let url='https://fanfusion-demo.onrender.com/?utm_campaign='+encodeURIComponent(t);document.getElementById('v7LinkOut').textContent=url;copyText(url)}
let v7MediaQ='';
mediaManager=function(){return `<form class="row" onsubmit="event.preventDefault();v7MediaQ=this.q.value;render()"><input name="q" placeholder="Search media filename" value="${esc(v7MediaQ)}"><button>Search</button></form>`+v7OldMedia().replace(/<div class="card stack">(?=<video|<img)/g,'<div class="card stack v7-media-item">')}
support=function(admin=false){let h=v7OldSupport(admin);if(!admin)h=h.replace('${never}','').replace('<label>Subject',`<label>Category${select('category',['General','Account access','VIP billing','Dropbox access','Giveaway','Technical issue'])}</label><label>Subject`);return h+`<div class="card stack"><h3>${admin?'Support workflow':'Help center'}</h3>${[['How do I access VIP?','VIP is a separate membership; use My Subscriptions to review access.'],['Where are my clips?','Check the Dropbox ticket in My Subscriptions. The actual library is outside the site.'],['How do I cancel?','Use My Subscriptions to turn off demo renewal. Real billing is not connected.'],['I cannot sign in','Use the provided demo login. Do not enter real passwords or private information.']].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}<p>For actual business questions, use the official FANFUSION contact page. No guaranteed response time in the demo.</p></div>`}
createTicket=function(form){let before=db.tickets.length;v7OldCreate(form);if(db.tickets.length>before){let t=db.tickets[0];t.category=form.category?.value||'General';t.created=now();save();render()}}
const v7OldReply=replyTicket;replyTicket=function(f,i){if(!adminGuard())return;v7OldReply(f,i);let t=db.tickets.find(t=>t.id===i);if(t){t.updated=now();save()}}
function v7GiveDeadline(){let d=db.giveaway.end;if(!d)return NaN;let base=Date.parse(d+'T23:59:59Z');if(!Number.isFinite(base))return NaN;let dt=new Date(base),parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(dt),p=Object.fromEntries(parts.map(x=>[x.type,x.value])),local=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour,+p.minute,+p.second);return base+(base-local)}
ffEligibleGive=function(){let end=v7GiveDeadline();return db.giveaway.active&&(!db.giveaway.end||Number.isFinite(end)&&end>=Date.now())}
v6Tick=function(){let ms=v7GiveDeadline()-Date.now();document.querySelectorAll('[data-give-clock]').forEach(e=>{e.textContent=!db.giveaway.active||Number.isFinite(ms)&&ms<=0?'Entries closed':!Number.isFinite(ms)?'Deadline pending':`${Math.floor(ms/86400000)}d ${Math.floor(ms/3600000)%24}h ${Math.floor(ms/60000)%60}m ${Math.floor(ms/1000)%60}s · ET`})}
registerStep=function(form){let d=fd(form),u=String(d.username||'').trim();if(!/^[a-zA-Z0-9_-]{3,24}$/.test(u)||u.toUpperCase()==='ADMIN')return toast('Use a 3–24 character demo username (letters, numbers, _ or -)');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(d.email||''))return toast('Enter a valid fictional email address');let age=(Date.now()-Date.parse(d.dob))/31557600000;if(!Number.isFinite(age)||age<18||age>120)return toast('Demo registration requires age 18+');v7OldRegisterStep(form)}
memberContent=function(){if(page==='analysts')return v7AnalystsPage();if(page==='archive')return v7Archive();if(page==='matchup')return v7MatchPage();if(page==='dashboard')return v7Dashboard();return v7OldMember()}
adminContent=function(){if(page==='marketing')return v7Calendar();if(page==='analysts')return v7AnalystsPage();if(page==='archive')return v7Archive();if(page==='matchup')return v7MatchPage();return v7OldAdmin()}
publicContent=function(){return page==='home'?v7Home():v7OldPublic()}
let v7LastPage='';
render=function(){let k=role+':'+page,oldY=window.scrollY||0,same=k===v7LastPage;v7OldRender();v7LastPage=k;if(same&&oldY)window.scrollTo({top:oldY,behavior:'instant'});if(page==='media'&&role==='admin'&&v7MediaQ)document.querySelectorAll('.v7-media-item').forEach(e=>e.hidden=!e.textContent.toLowerCase().includes(v7MediaQ.toLowerCase()));try{if(role==='member'||role==='admin')sessionStorage.setItem('ffDemoSession',JSON.stringify({role,id:user?.id,page}));else sessionStorage.removeItem('ffDemoSession')}catch{}}

function v8Faq(){return `<div class="card stack v8-faq"><span class="eyebrow">GOOD TO KNOW</span><h3>Frequently asked questions</h3>${[['What is included with a free account?','Free Picks, sports insights, performance history and community announcements.'],['What does VIP add?','Access to the separate premium analyst broadcast channel. Results are not guaranteed.'],['Is Dropbox included in VIP?','No. Creator library access is a separate subscription.'],['When will my Dropbox invitation arrive?','An admin sends the invitation manually. No guaranteed delivery time has been established. Check My Subscriptions for status.'],['How do renewals and cancellation work?','Cancel automatic renewal in My Subscriptions; the paid access period remains until expiry. No real charges in the prototype.'],['How do referrals work?','15 qualifying registrations unlock a one-time 30-day bonus. Each 5 qualifying first paid VIP subscriptions unlock another 30-day bonus. Actual verification requires a backend.'],['Who can enter the giveaway?','The current campaign is a demonstration. Official eligibility, region, prize and rules must be approved before real entries are accepted.'],['What happens if renewal fails?','A 24-hour grace period is planned; actual billing and provider handling must be approved.']].map(([q,a])=>`<details><summary>${q}</summary><p>${a}</p></details>`).join('')}</div>`}
function v8Home(){let h=v8OldHome(),a=h.indexOf('<section class="hero v6-hero">'),b=h.indexOf('</section>',a);if(a<0||b<0)throw Error('Hero markup missing');h=h.slice(0,a)+`<section class="hero v8-hero"><img class="v8-hero-image" src="${v8HeroAsset}" alt="FANFUSION multi-sport athlete artwork" fetchpriority="high" decoding="async" width="1500" height="844"><div class="v8-hero-shade"></div><div class="v8-hero-copy"><span class="eyebrow">FANFUSION VENTURES</span><h1>${esc(db.settings.headline).split('\n').map((s,i)=>i?`<span>${s}</span>`:s).join('<br>')}</h1><p>${esc(db.settings.description)}</p><div class="v8-hero-actions"><button class="primary" onclick="registerModal()">Join free ↗</button><button class="gold" onclick="go('vip')">Explore VIP</button><button onclick="go('dropbox')">Sports clips</button></div></div><small class="v8-artcredit">FANFUSION supplied artwork · illustrative graphic</small></section>`+h.slice(b+10);
let ca=h.indexOf('<section class="section v6-spotlight'),ce=h.indexOf('</section>',ca),campaign='';if(ca>=0&&ce>=0){campaign=h.slice(ca,ce+10);h=h.slice(0,ca)+h.slice(ce+10)}
a=h.indexOf('<section class="section" id="products">');b=h.indexOf('</section>',a);if(a>=0&&b>=0)h=h.slice(0,a)+`<section class="section" id="products"><div class="sectionhead"><span class="eyebrow">YOUR EXPERIENCE</span><h2>ONE COMMUNITY. TWO PAID EXPERIENCES.</h2><p>Start free. VIP and creator subscriptions are independent.</p></div><div class="grid grid3 mobile-one v8-benefits">${[['FREE','Your sports community','Free Picks, game insights and community news.','free'],['VIP','Exclusive analyst channel','Separate premium content, transparent history and member access.','vip'],['CREATOR','Sports clip collection','Explore the 100K+ library and manual Dropbox invitation workflow.','dropbox']].map(([tag,n,d,p])=>`<div class="card stack ${p==='vip'?'goldcard':''}"><span class="eyebrow">${tag}</span><h3>${n}</h3><p>${d}</p><button class="${p==='vip'?'gold':'primary'}" onclick="go('${p}')">Explore ${tag} ↗</button></div>`).join('')}</div><button class="v6-compare-link" onclick="go('compare')">Compare membership benefits ↗</button></section><section class="section v8-trust"><div class="sectionhead"><span class="eyebrow">BUILT ON TRANSPARENCY</span><h2>KNOW WHAT YOU GET.</h2></div><div class="grid grid3 mobile-one">${[['Historical results','Review complete recorded outcomes, including losses.'],['Clear subscription terms','Separate products, renewal pricing and access status.'],['Community & support','Announcements, referral status and help in one place.']].map(([n,d])=>`<div class="card"><h3>${n}</h3><p>${d}</p></div>`).join('')}</div><p>Prototype records and forecasts are illustrative; no guaranteed outcomes.</p></section>`+h.slice(b+10);return h+campaign+`<section class="section">${v8Faq()}<div class="card stack v8-finalcta"><h2>READY TO JOIN THE FUSION?</h2><p>Explore the free member experience before choosing a paid plan.</p><button class="primary" onclick="registerModal()">Create a free demo account</button></div></section>`}
function v8Latest(){let f=document.getElementById('ffChatFeed');if(f)f.scrollTop=f.scrollHeight}
function v8JumpTo(id){let f=document.getElementById('ffChatFeed'),item=document.getElementById('v6-post-'+id);if(f&&item)f.scrollTop+=item.getBoundingClientRect().top-f.getBoundingClientRect().top-(f.clientHeight-item.offsetHeight)/2}
function v8Messages(ch){let admin=role==='admin';if(!admin&&ch==='vip'&&!isVIP())return v8OldChat(ch);if(v6ChannelKey!==ch){v6ChannelKey=ch;v6ChannelQuery=''}let posts=activePosts(ch).slice().sort((a,b)=>Date.parse(a.date)-Date.parse(b.date)||String(a.id).localeCompare(String(b.id))),pin=posts.find(p=>p.v6Pinned),last='',q=v6ChannelQuery.toLowerCase();return `<div class="ff-chat v8-chat channel"><div class="ff-chathead row between"><div class="row"><span class="ff-avatar">${ch==='vip'?'♛':ch==='free'?'#':'◉'}</span><div><h3>${ch==='vip'?'VIP PICKS':ch==='free'?'FREE PICKS':'ANNOUNCEMENTS'}</h3><small>${admin?'Admin broadcast channel':'Official channel · Read, react and save'}</small></div></div><button class="small" onclick="go('${admin?'publisher':'archive'}')">${admin?'Schedule':'Archive'}</button></div><div class="v6-channel-tools"><input type="search" aria-label="Search channel messages" placeholder="Search messages" value="${esc(v6ChannelQuery)}" oninput="v6ChatFilter(this)"><button class="small" onclick="v6Gallery('${ch}')">Media</button><button class="small" onclick="v8Latest()">Latest ↓</button></div>${pin?`<button class="v6-pin" onclick="v8JumpTo('${v7SafeId(pin.id)}')">📌 ${esc(pin.title||pin.body.slice(0,80))}</button>`:''}<div class="v8-historyhint">↑ Scroll up for older messages</div><div class="ff-chat-feed v8-feed" id="ffChatFeed" tabindex="0" aria-label="Channel messages, oldest to newest">${posts.map(p=>{let date=p.date.slice(0,10),sep=date!==last?`<div class="v6-day">${esc(v7Date(p.date))}</div>`:'';last=date;let hide=q&&!(`${p.title||''} ${p.body||''} ${p.analyst||''}`).toLowerCase().includes(q);return `${sep}<div class="ff-message" id="v6-post-${v7SafeId(p.id)}" ${hide?'hidden':''}><div class="v6-author"><span class="v6-avatar">FF</span><span>${esc(p.analyst||'FANFUSION')} · ${esc(new Date(p.date).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}))}</span>${admin?`<button class="small" onclick="v6Pin('${v7SafeId(p.id)}')">${p.v6Pinned?'Unpin':'Pin'}</button>`:''}</div>${postCard(p)}${admin?`<div class="row"><button class="small" onclick="editPost('${v7SafeId(p.id)}')">Edit</button><button class="small" onclick="postStatus('${v7SafeId(p.id)}')">Archive</button></div>`:''}</div>`}).join('')||empty('No messages yet.')}</div>${admin?`<form class="ff-composer" onsubmit="event.preventDefault();ffSend(this,'${ch}')"><label class="ff-attach" aria-label="Attach photos or videos">＋<input name="media" type="file" accept="image/*,video/*" multiple onchange="this.closest('form').querySelector('.ff-filecount').textContent=this.files.length+' attachment(s)'"></label><div class="ff-compose-body"><textarea name="body" rows="1" placeholder="Message #${ch}..." aria-label="Message"></textarea><small class="ff-filecount">Attach images or video</small></div><button class="primary" aria-label="Send message">Send ➤</button></form>`:'<div class="ff-readonly">Only administrators can post.</div>'}</div>`}
channel=function(ch){return v8Messages(ch)};

render=function(){let k=role+':'+page,old=document.getElementById('ffChatFeed'),same=k===v8PageKey,offset=old?.scrollTop||0,bottom=old?old.scrollHeight-old.scrollTop-old.clientHeight<80:true;let body=old&&same?document.querySelector('.ff-composer textarea')?.value:null;v8OldRender();v8PageKey=k;let feed=document.getElementById('ffChatFeed');if(feed){let ta=document.querySelector('.ff-composer textarea');if(ta&&body&&!v8ForceLatest)ta.value=body;let stick=!same||bottom||v8ForceLatest;if(stick)feed.scrollTop=feed.scrollHeight;else feed.scrollTop=offset;document.querySelector('.dashbody')?.classList.add('v8-channel-page');if(stick&&typeof requestAnimationFrame==='function')requestAnimationFrame(()=>{if(document.getElementById('ffChatFeed')===feed){v8Latest();feed.querySelectorAll('img,video').forEach(img=>{let event=img.tagName==='VIDEO'?'loadedmetadata':'load';img.addEventListener(event,()=>{if(feed.scrollHeight-feed.scrollTop-feed.clientHeight<450)v8Latest()},{once:true})})}})}let h=document.querySelector('.v8-hero');if(h&&db.settings.heroImage){let img=h.querySelector('.v8-hero-image');if(img)img.src=db.settings.heroImage}}

dropbox=function(){return v8OldDrop()+`<div class="${role==='public'?'section':'stack'}"><div class="card stack"><h3>Explore the creator collection</h3><div class="grid grid3 mobile-one">${[1,3,2].map(i=>`<div class="v8-library-card">${v6Photo(i,'v6-news-photo')}<h3>${esc(ffPhoto[i][0])}</h3><small>Illustrative sports preview · footage access via Dropbox</small></div>`).join('')}</div><p>Authorized showreel, verified formats and last-update details can be supplied by the team. No invented inventory or downloadable sample footage.</p></div></div>`}
